<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <link rel="manifest" href="./src/manifest.json" />
    <title>6-Bit Color Wheel</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

      body {
        background: #000;
      }

      div {
        box-sizing: border-box;
      }

      #colors {
        height: 100vh;
        width: 100vw;
      }

      #colors .color {
        position: absolute;
        top: calc(50% + 120px);
        left: calc(50% + 140px);
        transform: translate(-50%, -50%);
        width: 62px;
        height: 62px;
        border-radius: 31px;
        font-family: monospace;
        text-align: center;
        font-size: 10px;
        padding: 22px 0;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.3s;
        box-shadow: 2px 2px 15px #00000022;
        border: 2px solid #000;
      }
    </style>
  </head>
  <body>
    <div id="colors"></div>
    <script>
      const colorMap = ["00", "55", "AA", "FF"];
      const totalColors = colorMap.length;
      function main() {
        console.log("Generating colors...");
        for (let r = 0; r < totalColors; r++) {
          for (let g = 0; g < totalColors; g++) {
            for (let b = 0; b < totalColors; b++) {
              const color = `#${colorMap[r]}${colorMap[g]}${colorMap[b]}`;

              const colorIndex = r * totalColors * totalColors + g * totalColors + b;
              const normalizedR = r / (totalColors - 1);
              const normalizedG = g / (totalColors - 1);
              const normalizedB = b / (totalColors - 1);

              // Triangle vertices (red top, green bottom-left, blue bottom-right)
              const redVertex = { x: 0, y: -280 };
              const greenVertex = { x: -173, y: 100 };
              const blueVertex = { x: 173, y: 100 };

              // Barycentric interpolation
              let x = normalizedR * redVertex.x + normalizedG * greenVertex.x + normalizedB * blueVertex.x;
              x += r * -97;
              let y = normalizedR * redVertex.y + normalizedG * greenVertex.y + normalizedB * blueVertex.y;
              y += r * -37;

              // Calculate perceived brightness (using relative luminance formula)
              const r_linear = parseInt(colorMap[r], 16) / 255;
              const g_linear = parseInt(colorMap[g], 16) / 255;
              const b_linear = parseInt(colorMap[b], 16) / 255;
              const luminance = 0.2126 * r_linear + 0.7152 * g_linear + 0.0722 * b_linear;
              const textColor = luminance < 0.5 ? '#FFF' : '#000';

              const colorDiv = document.createElement("div");
              colorDiv.className = `color`;
              colorDiv.style.backgroundColor = color;
              colorDiv.style.marginLeft = `${x}px`;
              colorDiv.style.marginTop = `${y}px`;
              colorDiv.style.color = textColor;
              colorDiv.innerText = color;
              colorDiv.onmouseover = () => {
                const redValue = color.substring(1, 3);
                document.querySelectorAll('.color').forEach(div => {
                  if (!div.innerText.substring(1, 3).startsWith(redValue)) {
                    div.style.opacity = '0.2';
                  } else {
                    div.style.zIndex = '100';
                  }
                });
              };
              colorDiv.onmouseout = () => {
                document.querySelectorAll('.color').forEach(div => {
                  div.style.opacity = '1';
                  div.style.zIndex = '0';
                });
              };

              document.getElementById("colors").appendChild(colorDiv);
            }
          }
        }
      }

      main();
    </script>
  </body>
</html>
